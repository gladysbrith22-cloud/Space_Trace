services:
  - type: web
    name: space-trace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@spacetrace.test
      - key: ADMIN_PASSWORD
        sync: false
